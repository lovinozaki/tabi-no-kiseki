<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅の軌跡</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f6f7f9;color:#17202a}
#map{position:fixed;inset:0}
.top{position:fixed;top:12px;left:12px;right:12px;z-index:500;display:flex;justify-content:space-between}
.title,.btn{background:#fff;border:0;border-radius:15px;box-shadow:0 2px 14px #0002}
.title{padding:10px 14px;font-weight:700}
.btn{width:42px;height:42px;font-size:18px}
.sheet{position:fixed;left:10px;right:10px;bottom:10px;z-index:600;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-radius:22px;padding:12px;box-shadow:0 5px 30px #0003;max-height:66dvh;overflow-y:auto;overflow-x:hidden;transform:translate3d(0,var(--sheet-shift,0px),0);transition:transform .18s ease-out;touch-action:pan-y;will-change:transform;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.editor{height:calc(100dvh - 20px);max-height:none}
.sheet.dragging{transition:none}
.handle{width:48px;height:22px;margin:-6px auto 4px;position:relative}
.handle:after{content:"";position:absolute;left:5px;right:5px;top:8px;height:5px;background:#b9c0ca;border-radius:3px}
.collapsedTripHeader{height:48px;display:none;align-items:center;justify-content:space-between;padding:0 2px 2px}
.collapsedTripName{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.collapsedTopBtn{width:40px;height:40px;border:0;border-radius:50%;background:#f0f1f3;color:#3b82d0;font-size:25px;line-height:40px;flex:0 0 auto}
.sheet.collapsed .collapsedTripHeader{display:flex}
.name{font-weight:700;font-size:18px}
.sub{font-size:13px;color:#69717d;margin-top:5px}
.desc{font-size:14px;line-height:1.65;margin-top:14px}
.action{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font-size:15px;font-weight:700}
.create{background:#1769aa;color:#fff}
.select{background:#eef3ff;color:#1769aa}
.ghost{background:#f3f4f6;color:#4b5563}
.status{font-size:13px;color:#69717d;margin-top:12px}
.flow{margin-top:14px;padding:12px 13px;background:#f7f8fa;border-radius:16px}
.flowTitle{font-size:13px;font-weight:700;margin-bottom:8px}
.flowItem{display:flex;align-items:flex-start;gap:9px;font-size:14px}
.flowMain{flex:1;min-width:0}
.flowActions{display:flex;gap:5px;margin-top:5px}
.mini{border:0;background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:4px 8px;font-size:11px;color:#56606b}
.danger{color:#c0392b}
.manage{margin-top:8px;text-align:right}
.deleteTrip{margin-top:10px;color:#b42318;background:#fff1f0}
.flowDot{width:10px;height:10px;border-radius:50%;background:#1769aa;margin-top:5px;flex:0 0 auto}
.flowText{font-weight:600}
.flowMeta{font-size:11px;color:#69717d;margin-top:2px}
.flowLine{position:relative;display:flex;align-items:center;min-height:42px;margin-left:4px}
.flowLine:before{content:"";width:2px;height:42px;background:#cbd2da;position:absolute;left:0;top:0}
.flowMode{position:relative;margin-left:14px;padding:5px 10px;background:#eef4ff;border-radius:10px;font-size:12px;font-weight:600;color:#1769aa;z-index:1}
.complete{background:#17202a;color:#fff}
.saved{background:#e9f5ec;color:#26733b}
.modal{position:fixed;inset:0;z-index:900;background:#0006;display:none;align-items:flex-end}
.modal.open{display:flex}
.box{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:82dvh;overflow:auto}
.close{float:right;border:0;border-radius:50%;width:38px;height:38px;font-size:21px;background:#f0f1f3;color:#3b82d0}
.input{display:block;width:100%;margin:7px 0 14px;border:1px solid #d9dde4;border-radius:12px;padding:12px;font-size:15px}
.primary{width:100%;border:0;border-radius:13px;padding:13px;background:#1769aa;color:#fff;font-weight:700}
.row{display:block;width:100%;margin:8px 0;padding:14px;border:1px solid #e1e5eb;border-radius:13px;background:#fff;text-align:left;font-size:15px}
.tripRow{cursor:pointer}
.small{font-size:12px;color:#69717d}
.modeWrap{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.mode{flex:1 1 calc(33.333% - 7px);min-width:92px;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="title">旅の軌跡</div><button class="btn" id="loc">◎</button></div>

<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="collapsedTripHeader" id="collapsedTripHeader">
    <div class="collapsedTripName" id="collapsedTripName"></div>
    <button class="collapsedTopBtn" id="collapsedTopBtn" aria-label="トップページへ戻る">×</button>
  </div>

  <div id="startView">
    <div class="name">旅の軌跡</div>
    <div class="sub">あなたの旅を、地図に残します。</div>
    <div class="desc">旅が終わったあと、地図を見ながら<br>行った場所や思い出を少しずつ残していきます。</div>
    <button class="action create" id="makeBtn">＋ 旅を作成</button>
    <button class="action select" id="chooseBtn">📖 旅を選択</button>
  </div>

  <div id="tripView" class="hidden">
    <div class="name" id="tripName"></div>
    <div class="sub" id="tripDate"></div>
    <div class="status">この旅を記録しています。</div>
    <button class="action create" id="setStartBtn">📍 スタート地点を設定</button>
    <div class="flow" id="flow">
      <div class="flowTitle">旅の流れ</div>
      <div id="flowList"></div>
    </div>
    <button class="action create" id="addPlaceBtn">＋ 行った場所を追加</button>
    <button class="action complete" id="completeTripBtn">✓ この旅を保存して完了</button>
    <div class="status" id="startStatus"></div>
    <button class="action ghost" id="changeTripBtn">📖 別の旅を選択</button>
    <button class="action deleteTrip" id="deleteTripBtn">🗑 この旅を削除</button>
  </div>
</div>

<div class="modal" id="tripModal">
  <div class="box">
    <button class="close" id="tripModalClose">×</button>
    <h2 id="tripModalTitle">旅を作成</h2>

    <div id="makeArea">
      <div class="small">旅の名前</div>
      <input class="input" id="inputName" placeholder="例：アラタF35岩国基地">
      <div class="small">旅の開始日</div>
      <input class="input" id="inputStartDate" type="date">
      <div class="small">旅の終了日</div>
      <input class="input" id="inputEndDate" type="date">
      <button class="primary" id="saveTripBtn">この旅を作成する</button>
    </div>

    <div id="chooseArea" class="hidden">
      <div id="tripList"></div>
      <button class="action create" id="newTripFromListBtn">＋ 新しい旅を作成</button>
    </div>
  </div>
</div>

<div class="modal" id="startModal">
  <div class="box">
    <button class="close" id="startClose">×</button>
    <h2>スタート地点を設定</h2>
    <div class="small">この旅は、どこから始まりましたか？</div>
    <input class="input" id="startNameInput" placeholder="例：周南市下上、自宅、徳山駅">
    <button class="primary" id="saveStartBtn">この場所をスタート地点にする</button>
    <button class="action deleteTrip" id="deleteStartBtn">🗑 スタート地点を削除</button>
  </div>
</div>

<div class="modal" id="editPlaceModal">
  <div class="box">
    <button class="close" id="editPlaceClose">×</button>
    <h2>行った場所を変更</h2>
    <div class="small">場所の名前</div>
    <input class="input" id="editPlaceName" placeholder="例：広島駅">
    <div class="small">前の場所からの移動方法</div>
    <div class="modeWrap">
      <button class="row mode editMode" data-mode="car">🚗 車</button>
      <button class="row mode editMode" data-mode="shinkansen">🚅 新幹線</button>
      <button class="row mode editMode" data-mode="train">🚃 電車</button>
      <button class="row mode editMode" data-mode="bus">🚌 バス</button>
      <button class="row mode editMode" data-mode="walk">🚶 徒歩</button>
      <button class="row mode editMode" data-mode="flight">✈️ 飛行機</button>
    </div>
    <div id="editCarOptions" class="hidden">
      <label style="display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:14px">
        <input id="editAvoidTolls" type="checkbox" style="width:18px;height:18px">
        有料道路を使用しない
      </label>
    </div>
    <button class="primary" id="saveEditPlaceBtn">変更を保存</button>
    <button class="action deleteTrip" id="deletePlaceBtn">🗑 この場所を削除</button>
  </div>
</div>

<div class="modal" id="placeModal">
  <div class="box">
    <button class="close" id="placeClose">×</button>
    <h2>行った場所を追加</h2>
    <div class="small">場所の名前</div>
    <input class="input" id="placeNameInput" placeholder="例：岩国基地、錦帯橋">

    <div class="small">前の場所からの移動方法</div>
    <div class="modeWrap">
      <button class="row mode" data-mode="car">🚗 車</button>
      <button class="row mode" data-mode="shinkansen">🚅 新幹線</button>
      <button class="row mode" data-mode="train">🚃 電車</button>
      <button class="row mode" data-mode="bus">🚌 バス</button>
      <button class="row mode" data-mode="walk">🚶 徒歩</button>
      <button class="row mode" data-mode="flight">✈️ 飛行機</button>
    </div>

    <div id="carOptions" class="hidden">
      <label style="display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:14px">
        <input id="avoidTolls" type="checkbox" style="width:18px;height:18px">
        有料道路を使用しない
      </label>
    </div>

    <button class="primary" id="savePlaceBtn">この場所を追加</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([33.95,131.25],8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

const $=id=>document.getElementById(id);
const tripsKey="tabiNoKisekiTrips_v2";
const activeKey="tabiNoKisekiActiveTripId_v2";
// これまでのテスト用「新たな旅」データは、この新しいスタート版では引き継がない。
localStorage.removeItem("tabiNoKisekiTrips");
localStorage.removeItem("tabiNoKisekiActiveTripId");

let trips=[];
let activeTripId=localStorage.getItem(activeKey)||null;
let selectedMode="car";
let editingPlaceIndex=-1;

function loadTrips(){
  try{trips=JSON.parse(localStorage.getItem(tripsKey)||"[]")}catch(e){trips=[]}
  if(activeTripId && !trips.some(t=>t.id===activeTripId)) activeTripId=null;
}
function saveTrips(){localStorage.setItem(tripsKey,JSON.stringify(trips))}
function saveActive(){if(activeTripId)localStorage.setItem(activeKey,activeTripId);else localStorage.removeItem(activeKey)}
function formatDates(t){
  if(t.startDate&&t.endDate)return t.startDate===t.endDate?t.startDate:t.startDate+" ～ "+t.endDate;
  if(t.startDate)return t.startDate+" ～";
  if(t.endDate)return "～ "+t.endDate;
  return "日付未設定";
}
function activeTrip(){return trips.find(t=>t.id===activeTripId)||null}
function renderFlow(){
  const t=activeTrip();
  const list=$("flowList");
  if(!t){list.innerHTML="";return}

  const places=t.places||[];
  const items=[];
  if(t.startPlace) items.push({type:"start",name:t.startPlace.name,index:-1});
  places.forEach((p,i)=>items.push({type:"place",name:p.name,index:i,mode:p.mode,avoidTolls:p.avoidTolls}));

  if(!items.length){
    list.innerHTML='<div class="small">まずスタート地点を設定してください。</div>';
    return;
  }

  let html="";
  items.forEach((item,i)=>{
    if(i>0){
      const mode=items[i].mode;
      const toll=(mode==="car"&&items[i].avoidTolls)?"・有料道路なし":"";
      html+='<div class="flowLine"><div class="flowMode">'+escapeHtml(modeLabel(mode))+escapeHtml(toll)+'</div></div>';
    }

    const actions=item.type==="place"
      ?'<div class="flowActions"><button class="mini" data-edit-place="'+item.index+'">変更</button><button class="mini danger" data-delete-place="'+item.index+'">削除</button></div>'
      :'';

    html+='<div class="flowItem"><div class="flowDot"></div><div class="flowMain"><div class="flowText">'+escapeHtml(item.name)+'</div><div class="flowMeta">'+(item.type==="start"?"スタート":"")+'</div>'+actions+'</div></div>';
  });

  list.innerHTML=html;
}
function modeLabel(mode){
  return ({car:"車",shinkansen:"新幹線",train:"電車",bus:"バス",walk:"徒歩",flight:"飛行機"})[mode]||"移動";
}
function refreshStartStatus(){
  const t=activeTrip();
  if(!t){$("startStatus").textContent="";return}
  $("startStatus").textContent=t.completed?"✓ この旅は保存されています。":(t.startPlace?"":"まだスタート地点が設定されていません。");
  $("completeTripBtn").textContent=t.completed?"✓ 保存済み":"✓ この旅を保存して完了";
  $("completeTripBtn").classList.toggle("saved",!!t.completed);
  $("completeTripBtn").disabled=!!t.completed;
  renderFlow();
}

function render(){
  const t=activeTrip();
  $("startView").classList.toggle("hidden",!!t);
  $("tripView").classList.toggle("hidden",!t);
  $("sheet").classList.toggle("editor",!!t);
  $("collapsedTripHeader").classList.toggle("hidden",!t);
  $("collapsedTripName").textContent=t?t.name:"";
  if(t){
    $("tripName").textContent=t.name;
    $("tripDate").textContent=formatDates(t);
  }
  refreshStartStatus();
  requestAnimationFrame(()=>{if(typeof sheetMaxShift==="function")setSheetShift(Math.min(sheetShift,sheetMaxShift()),true);});
}

function openCreate(){
  $("tripModalTitle").textContent="旅を作成";
  $("makeArea").classList.remove("hidden");
  $("chooseArea").classList.add("hidden");
  $("inputName").value="";
  $("inputStartDate").value="";
  $("inputEndDate").value="";
  $("tripModal").classList.add("open");
}
function openChoose(){
  $("tripModalTitle").textContent="旅を選択";
  $("makeArea").classList.add("hidden");
  $("chooseArea").classList.remove("hidden");
  renderTripList();
  $("tripModal").classList.add("open");
}
function closeTripModal(){$("tripModal").classList.remove("open")}

function renderTripList(){
  const list=$("tripList");
  if(!trips.length){
    list.innerHTML='<div class="small" style="padding:12px 2px">まだ旅がありません。まず「旅を作成」してください。</div>';
    $("newTripFromListBtn").classList.add("hidden");
    return;
  }
  $("newTripFromListBtn").classList.remove("hidden");
  list.innerHTML=trips.map(t=>
    '<button class="row tripRow" data-trip-id="'+t.id+'">📖 '+escapeHtml(t.name)+'<div class="small">'+formatDates(t)+'</div></button>'
  ).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function selectTrip(id){
  const t=trips.find(x=>x.id===id);
  if(!t)return;
  activeTripId=t.id;
  saveActive();
  closeTripModal();
  render();
}

function createTrip(){
  const name=$("inputName").value.trim();
  if(!name){$("inputName").focus();return}
  const start=$("inputStartDate").value;
  const end=$("inputEndDate").value;
  if(start&&end&&end<start){alert("終了日は開始日以降にしてください。");return}
  const t={id:String(Date.now()),name,startDate:start,endDate:end,places:[],completed:false};
  trips.push(t);
  saveTrips();
  activeTripId=t.id;
  saveActive();
  closeTripModal();
  render();
}

function savePlace(){
  const t=activeTrip();
  if(!t)return;
  t.places=t.places||[];
  t.places.push({
    name:$("placeNameInput").value.trim()||"記憶した場所",
    mode:selectedMode,
    avoidTolls:selectedMode==="car"&&$("avoidTolls").checked
  });
  saveTrips();
  $("placeNameInput").value="";
  $("avoidTolls").checked=false;
  $("placeModal").classList.remove("open");
  refreshStartStatus();
}

$("loc").onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(
  p=>map.setView([p.coords.latitude,p.coords.longitude],14)
);

$("makeBtn").onclick=openCreate;
$("chooseBtn").onclick=openChoose;
$("changeTripBtn").onclick=openChoose;
$("collapsedTopBtn").onclick=()=>{
  activeTripId=null;
  saveActive();
  render();
  requestAnimationFrame(()=>setSheetShift(0,true));
};
$("saveTripBtn").onclick=createTrip;
$("newTripFromListBtn").onclick=openCreate;

$("tripList").onclick=e=>{
  const btn=e.target.closest("[data-trip-id]");
  if(btn)selectTrip(btn.dataset.tripId);
};

$("tripModalClose").onclick=closeTripModal;
$("tripModal").onclick=e=>{if(e.target===$("tripModal"))closeTripModal()};

$("flowList").onclick=e=>{
  const edit=e.target.closest("[data-edit-place]");
  const del=e.target.closest("[data-delete-place]");
  const t=activeTrip();
  if(!t)return;
  if(edit){
    editingPlaceIndex=Number(edit.dataset.editPlace);
    const p=t.places?.[editingPlaceIndex];
    if(!p)return;
    $("editPlaceName").value=p.name||"";
    $("editAvoidTolls").checked=!!p.avoidTolls;
    document.querySelectorAll(".editMode").forEach(btn=>{
      const on=btn.dataset.mode===(p.mode||"car");
      btn.style.background=on?"#1769aa":"#fff";
      btn.style.color=on?"#fff":"#17202a";
    });
    $("editCarOptions").classList.toggle("hidden",(p.mode||"car")!=="car");
    $("editPlaceModal").classList.add("open");
  }
  if(del){
    const i=Number(del.dataset.deletePlace);
    if(!confirm("この場所を旅から削除しますか？"))return;
    t.places.splice(i,1);
    saveTrips();
    refreshStartStatus();
  }
};

document.querySelectorAll(".editMode").forEach(btn=>btn.onclick=()=>{
  selectedMode=btn.dataset.mode;
  document.querySelectorAll(".editMode").forEach(x=>{
    const on=x===btn;
    x.style.background=on?"#1769aa":"#fff";
    x.style.color=on?"#fff":"#17202a";
  });
  $("editCarOptions").classList.toggle("hidden",selectedMode!=="car");
});
$("editPlaceClose").onclick=()=>$("editPlaceModal").classList.remove("open");
$("editPlaceModal").onclick=e=>{if(e.target===$("editPlaceModal"))$("editPlaceModal").classList.remove("open")};
$("saveEditPlaceBtn").onclick=()=>{
  const t=activeTrip();
  if(!t||editingPlaceIndex<0)return;
  const p=t.places?.[editingPlaceIndex];
  if(!p)return;
  const name=$("editPlaceName").value.trim();
  if(!name){$("editPlaceName").focus();return}
  p.name=name;
  p.mode=selectedMode;
  p.avoidTolls=selectedMode==="car"&&$("editAvoidTolls").checked;
  saveTrips();
  $("editPlaceModal").classList.remove("open");
  refreshStartStatus();
};
$("deletePlaceBtn").onclick=()=>{
  const t=activeTrip();
  if(!t||editingPlaceIndex<0)return;
  if(!confirm("この場所を旅から削除しますか？"))return;
  t.places.splice(editingPlaceIndex,1);
  saveTrips();
  editingPlaceIndex=-1;
  $("editPlaceModal").classList.remove("open");
  refreshStartStatus();
};

$("deleteTripBtn").onclick=()=>{
  const t=activeTrip();
  if(!t)return;
  if(!confirm("「"+t.name+"」を削除しますか？\nこの旅に登録した場所もすべて削除されます。"))return;
  trips=trips.filter(x=>x.id!==t.id);
  activeTripId=null;
  saveTrips();
  saveActive();
  render();
};

$("setStartBtn").onclick=()=>{
  const t=activeTrip();
  $("startNameInput").value=t?.startPlace?.name||"";
  $("startModal").classList.add("open");
};
$("startClose").onclick=()=>$("startModal").classList.remove("open");
$("startModal").onclick=e=>{if(e.target===$("startModal"))$("startModal").classList.remove("open")};
$("deleteStartBtn").onclick=()=>{
  const t=activeTrip();
  if(!t||!t.startPlace)return;
  if(!confirm("スタート地点を削除しますか？"))return;
  delete t.startPlace;
  saveTrips();
  $("startModal").classList.remove("open");
  refreshStartStatus();
};
$("saveStartBtn").onclick=()=>{
  const t=activeTrip();
  if(!t)return;
  const name=$("startNameInput").value.trim();
  if(!name){$("startNameInput").focus();return}
  t.startPlace={name:name};
  saveTrips();
  $("startModal").classList.remove("open");
  refreshStartStatus();
};
$("completeTripBtn").onclick=()=>{
  const t=activeTrip();
  if(!t)return;
  if(!t.startPlace){alert("まずスタート地点を設定してください。");return}
  t.completed=true;
  saveTrips();
  refreshStartStatus();
};
$("addPlaceBtn").onclick=()=>$("placeModal").classList.add("open");
$("placeClose").onclick=()=>$("placeModal").classList.remove("open");
$("placeModal").onclick=e=>{if(e.target===$("placeModal"))$("placeModal").classList.remove("open")};
document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{
  selectedMode=btn.dataset.mode;
  document.querySelectorAll(".mode").forEach(x=>{
    x.style.background=x===btn?"#1769aa":"#fff";
    x.style.color=x===btn?"#fff":"#17202a";
  });
  $("carOptions").classList.toggle("hidden",selectedMode!=="car");
});
$("savePlaceBtn").onclick=savePlace;

loadTrips();
if(!activeTripId && trips.length===1){
  activeTripId=trips[0].id;
  saveActive();
}
render();

const sheet=$("sheet");
let sheetStartY=0,sheetStartShift=0,sheetShift=0,draggingSheet=false;
let lastPointerY=0,lastPointerTime=0,pointerVelocity=0;

function collapsedSheetHeight(){ return 82; }
function sheetMaxShift(){
  if(!sheet.classList.contains("editor")) return 0;
  return Math.max(0,sheet.offsetHeight-collapsedSheetHeight());
}
function setSheetShift(v,animate=false){
  const max=sheetMaxShift();
  sheetShift=Math.max(0,Math.min(max,v));
  sheet.classList.toggle("dragging",!animate);
  sheet.classList.toggle("collapsed",max>0 && sheetShift>=max-2);
  sheet.style.setProperty("--sheet-shift",sheetShift+"px");
}
function isInteractiveTarget(el){
  return !!el.closest("button,a,input,select,textarea");
}
function beginSheetDrag(e){
  // シートの中身は通常スクロールさせ、移動操作はバー部分から行う。
  if(!e.target.closest(".handle,.collapsedTripHeader")) return;
  if(isInteractiveTarget(e.target)) return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  draggingSheet=true;
  sheetStartY=e.clientY;
  sheetStartShift=sheetShift;
  lastPointerY=e.clientY;
  lastPointerTime=performance.now();
  pointerVelocity=0;
  sheet.classList.add("dragging");
  try{sheet.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
}
function moveSheetDrag(e){
  if(!draggingSheet)return;
  const now=performance.now(),dt=Math.max(8,now-lastPointerTime);
  const dy=e.clientY-lastPointerY;
  pointerVelocity=dy/dt;
  lastPointerY=e.clientY;
  lastPointerTime=now;
  let next=sheetStartShift+(e.clientY-sheetStartY);
  const max=sheetMaxShift();
  if(next<0)next*=.18;
  if(next>max)next=max+(next-max)*.18;
  setSheetShift(next,false);
  e.preventDefault();
}
function finishSheetDrag(e){
  if(!draggingSheet)return;
  const max=sheetMaxShift();
  let target;
  if(pointerVelocity<-.45)target=0;
  else if(pointerVelocity>.45)target=max;
  else target=sheetShift<max/2?0:max;
  draggingSheet=false;
  sheet.classList.remove("dragging");
  setSheetShift(target,true);
  try{sheet.releasePointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
}
sheet.addEventListener("pointerdown",beginSheetDrag,{passive:false});
sheet.addEventListener("pointermove",moveSheetDrag,{passive:false});
sheet.addEventListener("pointerup",finishSheetDrag,{passive:false});
sheet.addEventListener("pointercancel",finishSheetDrag,{passive:false});

function normalizeSheetPosition(){
  const max=sheetMaxShift();
  sheetShift=Math.max(0,Math.min(max,sheetShift));
  sheet.classList.toggle("collapsed",max>0&&sheetShift>=max-2);
  sheet.style.setProperty("--sheet-shift",sheetShift+"px");
}
window.addEventListener("resize",()=>requestAnimationFrame(normalizeSheetPosition));
window.addEventListener("orientationchange",()=>setTimeout(normalizeSheetPosition,120));
requestAnimationFrame(normalizeSheetPosition);
</script>
