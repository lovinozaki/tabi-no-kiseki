<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅の軌跡</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#1769aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--text);background:#eef2f5}
#map{height:100dvh}
.topbar{position:absolute;z-index:1000;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.title{background:#fffffff2;border:1px solid #ffffffaa;padding:10px 15px;border-radius:16px;font-size:20px;font-weight:750;box-shadow:0 3px 18px #0002;pointer-events:auto}
.iconbtn{width:44px;height:44px;border:0;border-radius:14px;background:#fffffff2;box-shadow:0 3px 18px #0002;font-size:20px}
.maptools{position:absolute;z-index:1000;right:14px;top:76px;display:flex;flex-direction:column;gap:8px}
.maptools button{width:44px;height:44px;border:0;border-radius:14px;background:#fffffff2;box-shadow:0 3px 18px #0002;font-size:18px}
.sheet{position:absolute;z-index:1000;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#fffffff5;border:1px solid #fff;border-radius:24px;padding:12px;box-shadow:0 6px 30px #0003;backdrop-filter:blur(12px)}
.handle{width:38px;height:4px;border-radius:4px;background:#c8cdd4;margin:0 auto 10px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:0;border-radius:12px;padding:9px 13px;background:#edf0f3;color:#344054;white-space:nowrap;font-size:14px}
.filters button.active{background:#172033;color:#fff}
.triprow{display:flex;align-items:center;gap:12px;padding:10px 2px 4px}
.tripdot{width:12px;height:12px;border-radius:50%;background:#1769aa;flex:none}
.tripname{font-size:17px;font-weight:750;flex:1}
.chev{font-size:20px;color:#8993a1}
.meta{font-size:13px;color:var(--muted);padding-left:24px;line-height:1.5}
.legend{display:flex;gap:12px;margin-top:8px;padding-left:24px;font-size:12px;color:#5d6673}
.legend span{white-space:nowrap}
.modal{position:absolute;z-index:2000;inset:0;background:#0005;display:none;align-items:flex-end}
.modal.open{display:flex}
.card{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -5px 30px #0003}
.cardhead{display:flex;justify-content:space-between;align-items:center}
.card h2{margin:0;font-size:21px}
.close{border:0;background:#eef1f4;width:40px;height:40px;border-radius:12px;font-size:20px}
.card p{margin:10px 0;color:#4b5563;line-height:1.6}
.badge{display:inline-block;padding:6px 10px;background:#eef5fb;border-radius:10px;font-size:13px;margin-right:6px}
.note{font-size:12px;color:#8a93a0;margin-top:12px}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="title">旅の軌跡</div>
  <button class="iconbtn" id="layerBtn" aria-label="地図設定">☷</button>
</div>

<div class="maptools">
  <button id="locBtn" aria-label="現在地">◎</button>
  <button id="zoomBtn" aria-label="ルート全体">⌖</button>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div class="filters">
    <button class="active" data-filter="all">すべて</button>
    <button data-filter="year">2026</button>
    <button data-filter="trip">旅</button>
    <button data-filter="place">場所</button>
    <button data-filter="person">同行者</button>
  </div>
  <div class="triprow" id="tripOpen">
    <div class="tripdot"></div>
    <div class="tripname">アラタF35岩国基地</div>
    <div class="chev">›</div>
  </div>
  <div class="meta">2026年9月23日　・　アラタ　・　🚗 車</div>
  <div class="legend"><span>● 移動の軌跡</span><span>○ 出発・到着</span></div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="cardhead">
      <h2>アラタF35岩国基地</h2>
      <button class="close" id="close">×</button>
    </div>
    <p>2026年9月23日、アラタと岩国方面へ。車で移動し、パブリックアクセスロード周辺を撮影拠点として過ごした旅。</p>
    <span class="badge">🚗 車</span><span class="badge">👤 アラタ</span><span class="badge">📷 写真</span>
    <div class="note">※現在の線は画面確認用の試作ルートです。実際の軌跡データは後で置き換えます。</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map",{zoomControl:false}).setView([34.17,132.25],10);

const standard=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);
const satellite=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"Tiles © Esri",maxZoom:19});

const route=[
 [34.055,131.805],
 [34.075,131.86],
 [34.11,131.93],
 [34.145,132.01],
 [34.16,132.08],
 [34.17,132.18],
 [34.17,132.25]
];

const line=L.polyline(route,{color:"#1769aa",weight:6,opacity:.9,lineCap:"round",lineJoin:"round"}).addTo(map);
const start=L.circleMarker(route[0],{radius:7,color:"#1769aa",fillOpacity:1}).addTo(map);
const end=L.circleMarker(route[route.length-1],{radius:7,color:"#1769aa",fillOpacity:1}).addTo(map);

function fitRoute(){map.fitBounds(line.getBounds(),{padding:[35,120]});}
fitRoute();

document.getElementById("zoomBtn").onclick=fitRoute;

document.getElementById("locBtn").onclick=()=>{
  if(!navigator.geolocation){alert("この端末では現在地を取得できません。");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    map.setView([pos.coords.latitude,pos.coords.longitude],14);
    L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:8,color:"#1769aa",fillOpacity:.85}).addTo(map);
  },()=>alert("現在地を取得できませんでした。"));
};

document.getElementById("layerBtn").onclick=()=>{
  const useSat=map.hasLayer(standard);
  if(useSat){map.removeLayer(standard);satellite.addTo(map)}
  else{map.removeLayer(satellite);standard.addTo(map)}
};

document.querySelectorAll(".filters button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    // 0.2ではUI確認用。データ連動は次段階で実装。
  };
});

const modal=document.getElementById("modal");
document.getElementById("tripOpen").onclick=()=>modal.classList.add("open");
document.getElementById("close").onclick=()=>modal.classList.remove("open");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});
</script>
</body>
</html>
