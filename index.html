<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅の軌跡</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f6f7f9;color:#17202a}#map{position:fixed;inset:0}.top{position:fixed;top:12px;left:12px;right:12px;z-index:500;display:flex;justify-content:space-between}.title,.btn{background:#fff;border:0;border-radius:15px;box-shadow:0 2px 14px #0002}.title{padding:10px 14px;font-weight:700}.btn{width:42px;height:42px;font-size:18px}.sheet{position:fixed;left:10px;right:10px;bottom:10px;z-index:600;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-radius:22px;padding:12px;box-shadow:0 5px 30px #0003;max-height:38vh;overflow:auto;transform:translateY(var(--shift,0px));transition:transform .18s ease-out;touch-action:none}.sheet.dragging{transition:none}.handle{width:48px;height:22px;margin:-6px auto 4px;position:relative}.handle:after{content:"";position:absolute;left:5px;right:5px;top:8px;height:5px;background:#b9c0ca;border-radius:3px}.name{font-weight:700;font-size:18px}.sub{font-size:13px;color:#69717d;margin-top:5px}.desc{font-size:14px;line-height:1.65;margin-top:14px}.action{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font-size:15px;font-weight:700}.create{background:#1769aa;color:#fff}.select{background:#eef3ff;color:#1769aa}.modal{position:fixed;inset:0;z-index:900;background:#0006;display:none;align-items:flex-end}.modal.open{display:flex}.box{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:80vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}.input{display:block;width:100%;margin:7px 0 14px;border:1px solid #d9dde4;border-radius:12px;padding:12px;font-size:15px}.primary{width:100%;border:0;border-radius:13px;padding:13px;background:#1769aa;color:#fff;font-weight:700}.row{display:block;width:100%;margin:8px 0;padding:13px;border:1px solid #e1e5eb;border-radius:13px;background:#fff;text-align:left}.small{font-size:12px;color:#69717d}
</style></head><body><div id="map"></div><div class="top"><div class="title">旅の軌跡</div><button class="btn" id="loc">◎</button></div><div class="sheet"><div class="handle"></div><div class="name" id="tripName">旅の軌跡</div><div class="sub" id="tripDate">あなたの旅を、地図に残します。</div><div class="desc">旅が終わったあと、地図を見ながら<br>行った場所や思い出を少しずつ残していきます。</div><button class="action create" id="make">＋ 旅を作成</button><button class="action select" id="choose">📖 旅を選択</button></div><div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><h2 id="title">旅を作成</h2><div id="makeArea"><div class="small">旅の名前</div><input class="input" id="inputName" placeholder="例：アラタF35岩国基地"><div class="small">旅の開始日</div><input class="input" id="inputStartDate" type="date"><div class="small">旅の終了日</div><input class="input" id="inputEndDate" type="date"><button class="primary" id="save">この旅を作成する</button></div><div id="chooseArea" style="display:none"><div id="list"></div></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map("map").setView([33.95,131.25],8);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
const $=id=>document.getElementById(id),modal=$("modal");
let trips=JSON.parse(localStorage.getItem("tabiNoKisekiTrips")||"[]");
let selectedTripId=null;
function saveTrips(){localStorage.setItem("tabiNoKisekiTrips",JSON.stringify(trips))}
function formatDates(t){if(t.startDate&&t.endDate)return t.startDate===t.endDate?t.startDate:t.startDate+" ～ "+t.endDate;if(t.startDate)return t.startDate+" ～";if(t.endDate)return "～ "+t.endDate;return "日付未設定"}
function selectTrip(t){selectedTripId=t.id;$("tripName").textContent=t.name;$("tripDate").textContent=formatDates(t);modal.classList.remove("open")}
$("loc").onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],14));
$("make").onclick=()=>{$("title").textContent="旅を作成";$("makeArea").style.display="block";$("chooseArea").style.display="none";$("inputName").value="";$("inputStartDate").value="";$("inputEndDate").value="";modal.classList.add("open")};
$("choose").onclick=()=>{$("title").textContent="旅を選択";$("makeArea").style.display="none";$("chooseArea").style.display="block";$("list").innerHTML=trips.length?trips.map((t,i)=>'<button class="row" data-i="'+i+'">📖 '+t.name+'<div class="small">'+formatDates(t)+"</div></button>").join(""):'<div class="small" style="padding:12px 2px">まだ旅がありません。まず「旅を作成」してください。</div>';document.querySelectorAll("[data-i]").forEach(btn=>btn.onclick=()=>selectTrip(trips[Number(btn.dataset.i)]));modal.classList.add("open")};
$("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
$("save").onclick=()=>{const n=$("inputName").value.trim();if(!n){$("inputName").focus();return}const start=$("inputStartDate").value,end=$("inputEndDate").value;if(start&&end&&end<start){alert("終了日は開始日以降にしてください。");return}const t={id:Date.now().toString(),name:n,startDate:start,endDate:end};trips.push(t);saveTrips();selectTrip(t)};
const sheet=document.querySelector(".sheet");let sy=0,ss=0,shift=0,drag=false,vy=0,ly=0,lt=0;function max(){return Math.max(0,sheet.offsetHeight-48)}function set(v){shift=Math.max(0,Math.min(max(),v));sheet.style.setProperty("--shift",shift+"px")}function down(e){if(e.target.closest("button,input,a"))return;drag=true;sy=e.clientY;ss=shift;ly=e.clientY;lt=performance.now();vy=0;sheet.classList.add("dragging");e.preventDefault()}function move(e){if(!drag)return;let n=performance.now(),d=Math.max(8,n-lt);vy=(e.clientY-ly)/d;ly=e.clientY;lt=n;set(ss+e.clientY-sy);e.preventDefault()}function up(e){if(!drag)return;drag=false;sheet.classList.remove("dragging");let m=max();set(vy<-.45?0:vy>.45?m:shift<m/2?0:m);if(e)e.preventDefault()}sheet.addEventListener("pointerdown",down,{passive:false});sheet.addEventListener("pointermove",move,{passive:false});sheet.addEventListener("pointerup",up,{passive:false});sheet.addEventListener("pointercancel",up,{passive:false});window.onresize=()=>set(shift<max()/2?0:max());
</script></body></html>
